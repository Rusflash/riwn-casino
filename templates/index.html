<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RuWin Casino</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a12; color:#fff; font-family:Arial; min-height:100vh; display:flex; justify-content:center; align-items:center; flex-direction:column; padding:20px; }
        .container { max-width:500px; width:100%; background:#1a1a2e; padding:30px; border-radius:16px; border:1px solid rgba(255,215,0,0.1); text-align:center; }
        h1 { font-size:32px; color:#ffd700; }
        .balance { font-size:28px; color:#00ff88; margin:20px 0; }
        .games { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0; }
        .game-btn { padding:15px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; cursor:pointer; font-size:15px; }
        .game-btn:hover { background:rgba(255,215,0,0.1); border-color:#ffd700; }
        .result { margin:15px 0; padding:15px; border-radius:10px; min-height:50px; background:rgba(255,255,255,0.03); font-size:16px; }
        .win { color:#00ff88; border:1px solid rgba(0,255,136,0.2); }
        .loss { color:#ff0040; border:1px solid rgba(255,0,64,0.2); }
        .info { color:#888; border:1px solid rgba(255,255,255,0.05); }
        input { width:100%; padding:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:16px; margin:10px 0; }
        .spin-btn { width:100%; padding:14px; background:linear-gradient(45deg,#ffd700,#ffaa00); border:none; border-radius:10px; color:#000; font-size:18px; font-weight:700; cursor:pointer; }
        .spin-btn:hover { transform:scale(1.02); }
        .spin-btn:disabled { opacity:0.4; cursor:not-allowed; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎰 RuWin</h1>
    <div class="balance">💰 <span id="balance">10 000</span> ₽</div>
    <div class="games">
        <button class="game-btn" onclick="loadGame('slots')">🎰 Слоты</button>
        <button class="game-btn" onclick="loadGame('roulette')">🎡 Рулетка</button>
        <button class="game-btn" onclick="loadGame('blackjack')">🃏 Блэкджек</button>
        <button class="game-btn" onclick="loadGame('crash')">✈️ Aviator</button>
    </div>
    <div id="result" class="result info">Выберите игру</div>
    <input type="number" id="betAmount" value="100" min="1">
    <button class="spin-btn" id="actionBtn" onclick="playGame()">🎲 ИГРАТЬ</button>
</div>
<script>
let currentGame='slots';
function loadGame(g){currentGame=g;document.querySelectorAll('.game-btn').forEach(b=>b.style.borderColor='rgba(255,255,255,0.1)');document.querySelector(`.game-btn[onclick="loadGame('${g}')"]`).style.borderColor='#ffd700';document.getElementById('result').textContent='Игра: '+g;document.getElementById('result').className='result info';}
async function playGame(){
const btn=document.getElementById('actionBtn');if(btn.disabled)return;
const amount=parseFloat(document.getElementById('betAmount').value);
if(isNaN(amount)||amount<=0){document.getElementById('result').textContent='❌ Введите сумму!';document.getElementById('result').className='result loss';return;}
const balance=parseInt(document.getElementById('balance').textContent.replace(/\s/g,'').replace(/[^0-9]/g,''));
if(amount>balance){document.getElementById('result').textContent='❌ Недостаточно средств!';document.getElementById('result').className='result loss';return;}
btn.disabled=true;const result=document.getElementById('result');result.textContent='⏳ Играем...';result.className='result info';
try{
let endpoint='';let payload={session_id:'test',amount:amount};
if(currentGame==='slots')endpoint='/api/slots/spin';
else if(currentGame==='roulette'){endpoint='/api/roulette/spin';payload.bet_type='red';}
else if(currentGame==='blackjack')endpoint='/api/blackjack/start';
else if(currentGame==='crash')endpoint='/api/crash/start';
const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
const data=await response.json();
if(data.success){
if(data.win!==undefined){result.className='result '+(data.win?'win':'loss');result.textContent=data.win?'🎉 ВЫИГРЫШ +'+data.win_amount+' ₽':'😞 ПРОИГРЫШ '+Math.abs(data.win_amount)+' ₽';if(data.stats)document.getElementById('balance').textContent=data.stats.balance;}
else if(data.crash_point){result.textContent='✈️ Краш на '+data.crash_point+'x';result.className='result info';setTimeout(async()=>{const cashout=await fetch('/api/crash/cashout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:'test',amount:amount,multiplier:1.5})});const cashData=await cashout.json();if(cashData.success){result.className='result win';result.textContent='🎉 ВЫИГРЫШ +'+cashData.win_amount+' ₽ (1.5x)';if(cashData.stats)document.getElementById('balance').textContent=cashData.stats.balance;}},1500);if(data.stats)document.getElementById('balance').textContent=data.stats.balance;btn.disabled=false;return;}
if(data.stats)document.getElementById('balance').textContent=data.stats.balance;
}else{result.className='result loss';result.textContent='❌ '+(data.error||'Ошибка!');}
}catch(e){result.className='result loss';result.textContent='❌ Ошибка соединения!';}
btn.disabled=false;}
document.addEventListener('DOMContentLoaded',function(){loadGame('slots');});
</script>
</body>
</html>
